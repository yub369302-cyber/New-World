services:
  - type: web
    name: job-hunter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RECIPIENT_EMAIL
        sync: false
      - key: JOB_KEYWORDS
        sync: false
      - key: JOB_CITIES
        sync: false
      - key: JOB_TYPE
        sync: false
      - key: JOB_EXCLUDE_KEYWORDS
        sync: false
      - key: RESUME_SUMMARY
        sync: false
      - key: SCHEDULE_HOURS
        sync: false
